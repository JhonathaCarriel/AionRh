<ion-content [fullscreen]="true" class="bg-light">
  <div class="container h-100 d-flex align-items-center justify-content-center">
    <div class="card shadow-lg p-4" style="max-width: 400px; width: 100%; border-radius: 10px;">
      <div class="text-center mb-4">
        <h4 class="mt-3">Hórus Plataforma</h4>
      </div>

      <form [formGroup]="loginForm" class="form">
        <div class="form-group mb-3">
          <label for="email" class="form-label">E-mail</label>
          <input 
            type="email" 
            id="email" 
            class="form-control" 
            formControlName="email" 
            placeholder="Digite seu e-mail" 
          />
        </div>

        <div class="form-group mb-3">
          <label for="password" class="form-label">Senha</label>
          <div class="input-group">
            <ion-input 
            type="password" 
            id="password"           
            label=""
            class="form-control" 
            formControlName="password" 
            placeholder="Digite sua senha" >
              <ion-input-password-toggle slot="end"></ion-input-password-toggle>
            </ion-input>
           
          
          </div>
        </div>


        <ion-button expand="block" (click)="login()">Acessar</ion-button>

        <div class="text-center">
          <a routerLink="/recuperasenha" class="text-decoration-none">
            Esqueceu sua senha?
          </a>
        </div>
      </form>
    </div>
  </div>
</ion-content>
