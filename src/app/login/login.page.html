<ion-content [fullscreen]="true" class="bg-light">
  <div class="container h-100 d-flex align-items-center justify-content-center">
    <div class="card shadow-lg p-4" style="max-width: 400px; width: 100%; border-radius: 10px;">
      <div class="text-center mb-3">
        <ion-img style="width: 100px; height: 100px; margin: 0 auto;" src="assets/logo.png"></ion-img>
      </div>

      <form [formGroup]="loginForm" class="form">
        <div class="form-group mb-3">
          <label for="email" class="form-label">E-mail</label>
          <input
            type="email"
            id="email"
            class="form-control"
            formControlName="email"
            placeholder="Digite seu e-mail"
          />
        </div>

        <div class="form-group mb-3">
          <label for="password" class="form-label">Senha</label>
          <div class="input-group">
            <ion-input
            type="password"
            id="password"
            label=""
            class="form-control"
            formControlName="password"
            placeholder="Digite sua senha" >
              <ion-input-password-toggle slot="end"></ion-input-password-toggle>
            </ion-input>
          </div>
        </div>

        <ion-button expand="block" (click)="login()">Acessar</ion-button>

        <div class="text-center mt-3">
          <a routerLink="/recuperasenha" class="text-decoration-none">
            Esqueceu sua senha?
          </a>
        </div>

        <div class="text-center mt-3">
          <span>Não tem uma conta? </span>
          <a routerLink="/cadastronovousuario" class="text-decoration-none fw-bold">
            Cadastre-se
          </a>
        </div>
      </form>
    </div>
  </div>
</ion-content>
