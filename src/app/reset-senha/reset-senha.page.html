<ion-content [fullscreen]="true" class="bg-light">
  <div class="container h-100 d-flex align-items-center justify-content-center">
    <div class="card shadow-lg p-4" style="max-width: 400px; width: 100%; border-radius: 10px;">
      <div class="text-center mb-3">
        <ion-img style="width: 100px; height: 100px; margin: 0 auto;" src="assets/logo.png"></ion-img>
      </div>

      <form class="form container mt-4" [formGroup]="resetPasswordForm">

        <div class="form-group mb-3">
          <label for="email" class="form-label">E-mail</label>
          <input type="email" id="email" class="form-control" formControlName="email" placeholder="Digite seu e-mail" />
        </div>


        <ion-button expand="block" (click)="resetPassword()">
          Recuperar Senha
        </ion-button>

      </form>
    </div>
  </div>
</ion-content>
